# Verifica o site (índice da busca em dia + node --test) e publica o conteúdo estático no GitHub Pages.
# Para a publicação funcionar, ative em Settings > Pages a fonte "GitHub Actions".
name: Verificar e publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir os arquivos gerados (índice, dados em script, links de idioma)
        run: node scripts/gerar-indice.js --verificar
      - name: Rodar os testes
        run: node --test

  publicar:
    needs: verificar
    # Só publica a partir da branch principal (push ou execução manual nela), nunca em PR.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
