<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
	<title>Cartão de previsão do tempo com 24 graus, sol entre nuvens e avisos do trajeto</title>
	<defs>
	<linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
	<stop offset="0" stop-color="#6fb1e6"/>
	<stop offset="1" stop-color="#d7ecfb"/>
	</linearGradient>
	</defs>
	<rect width="800" height="600" fill="url(#ceu)"/>
	<circle cx="600" cy="170" r="80" fill="#ffd54f"/>
	<g fill="#ffffff">
	<circle cx="500" cy="250" r="56"/>
	<circle cx="580" cy="262" r="70"/>
	<circle cx="666" cy="258" r="50"/>
	<rect x="500" y="262" width="166" height="46"/>
	</g>
	<text x="80" y="260" font-size="170" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#12324f">24°</text>
	<text x="86" y="320" font-size="36" font-family="Arial, Helvetica, sans-serif" fill="#12324f">Parcialmente nublado</text>
	<rect x="60" y="400" width="680" height="130" rx="18" fill="#1a1a1a" fill-opacity=".78"/>
	<text x="92" y="456" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">Metrô: aberto</text>
	<text x="92" y="502" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">350 m até o destino</text>
</svg>
